# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have (a dummy) recipes-* directory, add to BBFILES
BBFILES:append = " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS:append = " cyclonedx"
BBFILE_PATTERN_cyclonedx = "^${LAYERDIR}/"

LAYERDEPENDS_cyclonedx = "core"
LAYERSERIES_COMPAT_cyclonedx = "kirkstone"